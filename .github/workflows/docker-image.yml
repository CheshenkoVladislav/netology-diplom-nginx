name: Docker Image CI

on:
  push:
    branches: [ "*" ]
    tags: ["*"]

jobs:

      
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Yandex Container Registry
      uses: yc-actions/yc-cr-login@v2
      with:
        yc-sa-json-key: ${{ secrets.YC_SA_JSON_KEY }}

    - name: Build and push Docker image
      run: docker build . --tag cr.yandex/crpiav879qko4h8plsue/diplom-repository:${{ github.ref_name }}

  deploy:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/my-app my-app=cr.yandex/crpiav879qko4h8plsue/diplom-repository:${{ github.ref_name }}
          kubectl rollout status deployment/my-app
